# Ordinale Default Configuration
# This file defines the default settings for scanning and organizing documents.

[scanner]
# List of file extensions that Ordinale will discover and process.
# Extensions are case-insensitive and leading dots are optional.
extensions = [
    ".docx",
    ".pdf",
    ".html",
    ".htm",
    ".mhtml",
    ".txt",
    ".md",
    ".markdown",
    ".rtf",
]

[scanner.custom_types]
# Optional mapping of custom file extensions to supported parser types:
# Supported parsers: "docx", "pdf", "html", "text", "markdown", "rtf"
".markdown" = "markdown"
".htm" = "html"
".mhtml" = "html"
".rtf" = "rtf"

[model]
# Model identifier (defaults to "convaiinnovations/laya")
model_id = "convaiinnovations/laya"
# Offline mode policy: "auto" (default: uses offline mode if model is cached), "true", or "false"
offline = "auto"

[heuristics]
# Whether to include heuristic signals in categorization and triage outputs
record_signals = true
# If true, outputs detailed scoring breakdown for signals
detailed_signals = false

[heuristics.nlp]
# Enable spaCy-powered NLP entity recognition and filename parsing
enabled = true
# spaCy pipeline model name
model_name = "en_core_web_sm"

[heuristics.education_academic]
coursework_terms = [
    "homework",
    "problem set",
    "assignment",
    "lab report",
    "lab section",
    "course syllabus",
    "syllabus",
    "professor",
    "due date",
    "student id",
    "student name",
    "essay draft",
    "term paper",
    "term project",
    "midterm",
    "final exam",
    "class notes",
    "proposal",
    "project proposal",
]
preprint_servers = [
    "arxiv",
    "biorxiv",
    "medrxiv",
    "chemrxiv",
    "ssrn",
    "research square",
    "zenodo",
    "osf.io",
    "techrxiv",
]
journal_publishers = [
    "ieee",
    "acm",
    "springer",
    "elsevier",
    "nature",
    "science",
    "plos",
    "pnas",
    "pubmed",
    "wiley",
    "cell press",
    "taylor & francis",
    "frontiers in",
    "mdpi",
    "iop publishing",
    "acm sig",
    "ieee trans",
]
coursework_term_weight = 1.5
coursework_term_max_score = 4.0
preprint_weight = 3.5
journal_weight = 2.5
academic_marker_weight = 1.5
academic_marker_max_score = 3.0
format_prior_pdf = 1.5
format_prior_school = 1.5

[heuristics.education_academic.course_codes]
base_weight = 3.0
common_prefix_bonus = 1.0
uncommon_prefix_penalty = 1.5
proximity_name_bonus = 1.0
proximity_title_bonus = 1.0
isolated_penalty = 1.0
proximity_window_lines = 3
common_prefixes = [
    "cs", "comp", "it", "swe", "cis", "se", "ds",
    "math", "stat", "phys", "chem", "bio", "biol",
    "eng", "engl", "hist", "econ", "psyc", "psych",
    "phil", "poli", "posc", "soc", "anth", "comm",
    "bus", "mgmt", "fin", "acct", "mktg", "art",
    "mus", "span", "fren", "germ", "chin", "lang",
    "med", "nurs", "law", "ed", "educ", "geog",
    "geol", "astr", "ee", "ece", "me", "ce", "che",
    "is", "inf", "sci", "lit", "ling", "arch", "env",
]
non_course_prefixes = [
    "year", "tax", "date", "line", "page", "item", "rule", "step", "room",
    "form", "part", "chap", "total", "fund", "suite", "apt", "unit", "post",
    "bill", "acct", "card", "call", "code", "dial", "dept", "dest", "rate",
    "file", "stat", "view", "cost", "plus", "paid", "fees", "gain", "loss",
    "note", "text", "term", "type", "user", "time", "hour", "mins", "secs",
    "bug", "err", "issue", "task", "ver",
]

[heuristics.education_academic.names]
front_page_person_bonus = 1.5
university_bonus = 1.5
student_header_synergy_bonus = 2.5
filename_name_bonus = 1.0
university_keywords = [
    "university",
    "college",
    "institute of technology",
    "polytechnic",
    "faculty of",
    "department of",
    "school of",
    "academy",
    "campus",
]

[heuristics.scratch_notes]
enabled = true
filename_keywords = [
    "note", "notes", "scratch", "scratchpad", "meeting", "minutes",
    "todo", "draft", "wip", "brainstorm", "sync", "standup", "memo",
    "quicknotes", "agenda", "script", "run", "cmd", "command",
    "commands", "steps", "setup", "install", "cheatsheet", "howto",
    "sh", "bash", "terminal",
]
content_markers = [
    "meeting notes", "action items", "next steps", "attendees",
    "participants", "agenda", "quick notes", "brain dump", "sync notes",
]
checklist_patterns = [
    '[-*]\s*\[[ xX]\]',
    '\b(TODO|FIXME|TASK|ACTION ITEM)[\s:]',
]
command_patterns = [
    '^\s*(?:python|pip|npm|npx|node|docker|git|cargo|curl|wget|bash|sh|pwsh|powershell|uv|pytest)\b',
    '\s--[a-z0-9\-]+|\s-[a-zA-Z]\b',
    '[A-Za-z]:\\[^\r\n]+|/(?:usr|bin|var|etc|home)/',
    '(?i)\b(run script|how to run|usage:|command:|terminal:)',
]
format_prior_text = 1.5
format_prior_doc = 1.0
filename_bonus = 2.0
content_marker_weight = 1.5
content_marker_max_score = 3.5
checklist_bonus = 1.5
command_bonus = 2.0
bullet_ratio_threshold = 0.30
bullet_ratio_bonus = 1.0
override_threshold = 2.5
competitor_penalty = 4.0

[heuristics.web_snapshots]
enabled = true
html_extensions = [".html", ".htm", ".mhtml"]
html_format_prior = 3.0
article_header_patterns = [
    '(?i)\b(?:url|source|retrieved from):\s*https?://',
    '(?i)\b\d+\s*min read\b',
    '(?i)\bpublished (?:on|in):',
    '(?i)\b(?:archive\.today|wayback machine|pocket|readwise|substack)\b',
]
article_header_bonus = 2.5
non_web_text_penalty = 3.0
