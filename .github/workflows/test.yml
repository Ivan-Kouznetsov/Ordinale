name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_SYMLINKS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Restore Virtual Environment Cache
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py${{ matrix.python-version }}-venv-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}

      - name: Create Virtual Environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Activate Virtual Environment
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path

          venv = Path(".venv").resolve()
          scripts = venv / ("Scripts" if sys.platform == "win32" else "bin")

          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as f:
              f.write(f"{scripts}\n")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VIRTUAL_ENV={venv}\n")

      - name: Install dependencies (on cache miss)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]
          python -m spacy download en_core_web_sm

      - name: Reinstall ordinale in editable mode
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          pip install --no-deps -e .

      - name: Run Hermetic Unit Tests (Offline)
        run: |
          python -m pytest -v -m "not requires_model"
