repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: pytest-offline
        name: Run Offline Unit Tests
        entry: python scripts/run_offline_tests.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
